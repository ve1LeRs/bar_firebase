# Bar-only nginx FD durability (do NOT run ensure-bar-stack.sh — it patches xray).
#
# Symptom: /var/log/nginx/error.log floods with "Too many open files" / accept4 failed,
# and :8443 upstream to 127.0.0.1:3000 starts failing while health is intermittently OK.
# Cause: soft LimitNOFILE=1024 while worker_connections=4096.
#
# Apply on the bar VPS (main nginx.conf, top-level — NOT inside http{} / stream{}):
#
#   worker_processes auto;
#   worker_rlimit_nofile 65536;
#
# And systemd drop-in /etc/systemd/system/nginx.service.d/99-nofile.conf:
#
#   [Service]
#   LimitNOFILE=65536
#   LimitNOFILESoft=65536
#
# Then: systemctl daemon-reload && nginx -t && systemctl reload nginx
# (reload is enough for worker_rlimit_nofile; full restart also picks up systemd limits)
#
# Live emergency without restart:
#   prlimit --pid $(pgrep -o nginx) --nofile=65536:65536
#   for w in $(pgrep -P $(pgrep -o nginx)); do prlimit --pid "$w" --nofile=65536:65536; done
#
# Never touch xray / personal-xray-vpn / port 443 stream map when applying this.
