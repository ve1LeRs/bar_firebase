# Bar API — HTTPS :2083 only. Never bind bar to :443 (VPN/xray stream).
upstream bar_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ACME / redirect on :80 (HTTP only)
server {
    listen 80;
    listen [::]:80;
    server_name asafievbar.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host:2083$request_uri;
    }
}

# Mini App API
server {
    listen 2083 ssl http2;
    listen [::]:2083 ssl http2;
    server_name asafievbar.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/asafievbar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asafievbar.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://bar_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

